# Per-source weights for rank-favorites.
#
# These affect RANKING only: tie-breaks between equal scores, and the amount
# --vote-boost adds. They deliberately do NOT affect --vote-qualify, which
# counts distinct sources, so no single list can qualify a game on its own no
# matter how highly it is weighted.
#
# Key is the part of the filename after the platform prefix:
#   scummvm-advgamers100.txt  ->  advgamers100
# A source with no entry here defaults to 1.0.
#
# The ordering below reflects how relevant each source is to a 1987-1998
# adventure collection, not how well known the outlet is.

# Genre-specific enthusiast polls. Adventure Gamers is a reader poll of the
# adventure community itself, which is the closest thing to a canonical
# ranking this genre has.
advgamers100 = 2.0
aggies = 1.5

# The AGS database and awards are the only sources that cover freeware AGS
# games at all. Panel ratings are assigned by a review panel, not raw user
# votes, so they are worth more than a mention in a listicle.
agsdb = 1.5
agsawards = 1.5

# Publisher-specific deep rankings. PC Gamer's Sierra list ranks all 63 of
# their graphical adventures, which is far more discriminating than a top ten.
lucasarts-sierra = 1.2

# Retro enthusiast sites. Smaller lists, but era-appropriate and they surface
# titles the rating databases score poorly or miss entirely.
retrododo = 1.0
racketboy = 1.0
retrojunk = 1.0

# Mainstream games press. Useful corroboration, but these skew modern and name
# a lot of games that are not in a ScummVM collection, so a mention here is
# weaker evidence about a 1993 adventure game specifically.
ign = 0.8
pcgamer = 0.8
rps = 0.8
